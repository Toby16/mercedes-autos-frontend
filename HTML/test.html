<body>
    <div class="range-wrapper">
        <input type="range" id="min" min="0" max="100" value="20">
        <input type="range" id="max" min="0" max="100" value="80">

        <div class="values">
            <span id="minVal">20</span> - <span id="maxVal">80</span>
        </div>
    </div>
    
    <hr>

    <div class="range_wrapper">
        <input type="range" id="min_range" min="1000" max="155000000" value="39999">
        <input type="range" id="max_range" min="1000" max="155000000" value="99999999">
        <div class="prices">
            €<span id="min_val">39999</span> - €<span id="max_val">99999999</span>
        </div>
    </div>
    
    <!-- JavaScript -->
     <script src="../JS/test.js"></script>
</body>
