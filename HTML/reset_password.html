<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset/Request your password!</title>
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../CSS/reset_password.css">

    <link rel="preload" href="../assets/background_img_14.jpg" as="image">
    <link rel="preload" href="../assets/background_img_15.jpg" as="image">
    <link rel="preload" href="../assets/background_img_16.jpg" as="image">
    <link rel="preload" href="../assets/background_img_17.jpg" as="image">

</head>
<body>
    <header>
        <a href="homepage.html">
	    	<img class="logo" src="../assets/logo.svg">
	    </a>
	    <a href="homepage.html">
            	<h1>Mercedes Autos</h1>
	    </a>
    </header>
    <br>

    <div class="reset_message">
        <p>Enter your new password and confirm the change</p>
        <hr>
    </div>

    <section class="password_input">
        <form>
            <label for="new_password">Enter new password</label>
            <br>
            <input id="new_password" name="password_1" placeholder="new password" type="password" required>
            <button type="button" id="toggleNewPassword">👁</button>
            <br>

            <label for="confirm_password">Confirm new password</label>
            <br>
            <input id="confirm_password" name="password_2" placeholder="confirm password" type="password" required>
            <button type="button" id="toggleconfirmPassword">👁</button>
            <br>

            <span>
            <input name="reset" type="submit" value="Reset">
            </span>
        </form>
    </section>
    <br>

    <section>
        <p>- or -</p>
        <button class="request_password">Request Password</button>
    </section>
    

    <!-- Javascript -->
    <script src="../JS/reset_password.js"></script>
</body>
</html>
